<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UPI OTP Verification</title>
  <style>
    body { font-family: Arial; background: #fdf8f4; max-width: 600px; margin: auto; padding: 40px; }
    h2 { color: #6b1a1a; }
    input, button {
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
      width: 100%;
    }
    button {
      background-color: #8B0000;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Enter OTP to Confirm UPI Payment</h2>
  <form method="POST">
    <input type="text" name="otp" placeholder="Enter OTP" required>
    <button type="submit">Verify</button>
  </form>
</body>
</html>
